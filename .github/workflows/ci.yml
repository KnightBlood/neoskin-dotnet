name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"
  FRONTEND_URL: "https://github.com/DreamCraft-Tech/blessing-skin-server-patch/releases/download/v6.0.10_patch/blessing-skin-server_6.0.10_patch_php85.zip"
  FRONTEND_SHA256: "bb94f83718f3fca3737a04b2097e747720ebd5966979cf042dbbba5434da3e73"

jobs:
  verify:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [ sqlite, mysql, mariadb, pgsql, sqlsrv ]

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_DATABASE: blessing_skin
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore NeoSkin.NET.slnx

      # ------------------------------------------------ MySQL / MariaDB ----
      - name: Start MySQL
        if: matrix.database == 'mysql'
        run: |
          docker run -d --name neoskin-db \
            -e MYSQL_ROOT_PASSWORD=123456 \
            -e MYSQL_DATABASE=blessing_skin \
            -e MYSQL_USER=blessing -e MYSQL_PASSWORD=123456 \
            -p 3306:3306 mysql:8.4 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            docker exec neoskin-db mysqladmin --protocol=tcp -h 127.0.0.1 \
              -u root --password=123456 ping && break
            sleep 2
          done
        shell: bash

      - name: Start MariaDB
        if: matrix.database == 'mariadb'
        run: |
          docker run -d --name neoskin-db \
            -e MARIADB_ROOT_PASSWORD=123456 \
            -e MARIADB_DATABASE=blessing_skin \
            -e MARIADB_USER=blessing -e MARIADB_PASSWORD=123456 \
            -p 3306:3306 mariadb:11.8 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            docker exec neoskin-db mariadb-admin --protocol=tcp -h 127.0.0.1 \
              -u root --password=123456 ping && break
            sleep 2
          done
        shell: bash

      # ---------------------------------------------------- PostgreSQL ----
      - name: Start PostgreSQL
        if: matrix.database == 'pgsql'
        run: |
          docker run -d --name neoskin-db \
            -e POSTGRES_PASSWORD=123456 \
            -e POSTGRES_DB=blessing_skin \
            -p 5432:5432 postgres:18
          for i in $(seq 1 60); do
            docker exec neoskin-db pg_isready -U postgres && break
            sleep 2
          done
        shell: bash

      # ----------------------------------------------------- SQL Server ----
      - name: Start SQL Server
        if: matrix.database == 'sqlsrv'
        env:
          SA_BOOTSTRAP_PASSWORD: 'Bootstrap_SA!2026'
          APP_SA_PASSWORD: '123456'
        run: |
          docker run -d --name neoskin-db \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$SA_BOOTSTRAP_PASSWORD" \
            -e MSSQL_PID=Developer \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2025-latest
          for i in $(seq 1 90); do
            docker exec neoskin-db /opt/mssql-tools18/bin/sqlcmd \
              -C -S localhost -U sa -P "$SA_BOOTSTRAP_PASSWORD" \
              -Q 'SELECT 1' -l 1 && break
            sleep 2
          done
          docker exec neoskin-db /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "$SA_BOOTSTRAP_PASSWORD" \
            -Q "CREATE DATABASE blessing_skin;
                CREATE LOGIN blessing WITH PASSWORD = '$APP_SA_PASSWORD', CHECK_POLICY = OFF;
                ALTER SERVER ROLE sysadmin ADD MEMBER blessing;"
          echo "DB_PORT=1433"                      >> "$GITHUB_ENV"
          echo "DB_USERNAME=blessing"              >> "$GITHUB_ENV"
          echo "DB_PASSWORD=123456"                >> "$GITHUB_ENV"
          echo "DB_ENCRYPT=false"                  >> "$GITHUB_ENV"
          echo "DB_TRUST_SERVER_CERTIFICATE=true"  >> "$GITHUB_ENV"
        shell: bash

      - name: Configure non-SQL-Server credentials
        if: matrix.database != 'sqlsrv'
        run: |
          case "${{ matrix.database }}" in
            mysql|mariadb)
              echo "DB_PORT=3306"         >> "$GITHUB_ENV"
              echo "DB_USERNAME=blessing" >> "$GITHUB_ENV"
              echo "DB_PASSWORD=123456"   >> "$GITHUB_ENV" ;;
            pgsql)
              echo "DB_PORT=5432"         >> "$GITHUB_ENV"
              echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
              echo "DB_PASSWORD=123456"   >> "$GITHUB_ENV" ;;
            sqlite)
              echo "DB_PORT="             >> "$GITHUB_ENV"
              echo "DB_USERNAME="         >> "$GITHUB_ENV"
              echo "DB_PASSWORD="         >> "$GITHUB_ENV" ;;
          esac
        shell: bash

      - name: dotnet test
        run: dotnet test NeoSkin.NET.slnx -c Release --no-restore

  platform-build:
    name: Platform build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-latest, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet build NeoSkin.NET.slnx -c Release

  platform-test:
    name: Platform test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet test NeoSkin.NET.slnx -c Release

  publish-aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: dotnet publish src/NeoSkin.Web -c Release -r ${{ matrix.rid }} -o publish

      - name: Smoke check binary
        shell: bash
        run: |
          ls -lh publish/neoskin*

      - uses: actions/upload-artifact@v7
        with:
          name: neoskin-${{ matrix.rid }}
          path: publish/
          retention-days: 7

  browser-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser test deps
        run: npm ci --prefix tests/browser

      - name: Fetch legacy frontend assets
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/bs.zip --retry 5 --retry-delay 10 --retry-all-errors "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  /tmp/bs.zip" | sha256sum -c -
          unzip -q /tmp/bs.zip -d /tmp/bs
          mkdir -p src/NeoSkin.Web/wwwroot
          rm -rf src/NeoSkin.Web/wwwroot/app
          cp -r /tmp/bs/public/app src/NeoSkin.Web/wwwroot/app

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Export Chrome path
        run: echo "NEOSKIN_CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: dotnet test (browser)
        env:
          NEOSKIN_BROWSER_E2E: "1"
        run: dotnet test NeoSkin.NET.slnx -c Release --filter "FullyQualifiedName~BrowserE2ETest"

name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  FRONTEND_REF: "v6.0.10_patch"

jobs:
  build:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
          - { os: macos-15-intel,   rid: osx-x64 }
          - { os: macos-latest,     rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish src/NeoSkin.Web -c Release -r ${{ matrix.rid }} -o publish

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch legacy frontend assets (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FRONTEND_REF" https://github.com/DreamCraft-Tech/blessing-skin-server-patch.git /tmp/bs-src
          corepack enable
          (cd /tmp/bs-src && yarn install --frozen-lockfile && yarn build
            && cp resources/assets/src/images/bg.webp resources/assets/src/images/favicon.ico public/app/
            && cp resources/assets/standalone/*.js public/app/)
          mkdir -p publish/wwwroot
          rm -rf publish/wwwroot/app
          cp -r /tmp/bs-src/public/app publish/wwwroot/app

      - name: Fetch legacy frontend assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'bs-src'
          Remove-Item $src -Recurse -Force -ErrorAction SilentlyContinue
          git clone --depth 1 --branch $env:FRONTEND_REF https://github.com/DreamCraft-Tech/blessing-skin-server-patch.git $src
          corepack enable
          Push-Location $src
          yarn install --frozen-lockfile
          yarn build
          Copy-Item resources/assets/src/images/bg.webp,resources/assets/src/images/favicon.ico public/app/
          Copy-Item resources/assets/standalone/*.js public/app/
          Pop-Location
          New-Item -ItemType Directory -Force publish/wwwroot | Out-Null
          Remove-Item publish/wwwroot/app -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $src 'public/app') publish/wwwroot/app -Recurse

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/public
          cp -r public/app-next publish/public/app-next
          cp README.md DEPLOYMENT.md publish/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'publish/*' `
            -DestinationPath "dist/neoskin-dotnet_${env:VERSION}_${{ matrix.rid }}.zip" -Force

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd publish && zip -r "../dist/neoskin-dotnet_${VERSION}_${{ matrix.rid }}.zip" .)
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dotnet-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true

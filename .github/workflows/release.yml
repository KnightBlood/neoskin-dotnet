name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  FRONTEND_URL: "https://github.com/DreamCraft-Tech/blessing-skin-server-patch/releases/download/v6.0.10_patch/blessing-skin-server_6.0.10_patch_php85.zip"
  FRONTEND_SHA256: "bb94f83718f3fca3737a04b2097e747720ebd5966979cf042dbbba5434da3e73"

jobs:
  build:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
          - { os: macos-15-intel,   rid: osx-x64 }
          - { os: macos-latest,     rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish src/NeoSkin.Web -c Release -r ${{ matrix.rid }} -o publish

      - name: Fetch legacy frontend assets
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo /tmp/bs.zip "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  /tmp/bs.zip" | sha256sum -c -
          unzip -q /tmp/bs.zip -d /tmp/bs
          mkdir -p publish/wwwroot
          rm -rf publish/wwwroot/app
          cp -r /tmp/bs/public/app publish/wwwroot/app

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/public
          cp -r public/app-next publish/public/app-next
          cp README.md DEPLOYMENT.md publish/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'publish/*' `
            -DestinationPath "dist/neoskin-dotnet_${env:VERSION}_${{ matrix.rid }}.zip" -Force

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd publish && zip -r "../dist/neoskin-dotnet_${VERSION}_${{ matrix.rid }}.zip" .)
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dotnet-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
